name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "./HisabKitabAndroid/gradlew" ]; then
            cd HisabKitabAndroid
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Searching for gradlew..."
            find . -name "gradlew" -exec chmod +x {} \;
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            DIR_PATH=$(dirname "$GRADLE_PATH")
            cd "$DIR_PATH"
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
