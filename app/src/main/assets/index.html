<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Hisab Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        accentBlue: '#3b82f6',
                        accentGreen: '#10b981',
                        accentRed: '#ef4444',
                        accentYellow: '#f59e0b',
                        accentPurple: '#8b5cf6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased pb-24 selection:bg-blue-500 selection:text-white">

    <!-- Top Header -->
    <header class="px-4 pt-6 pb-4">
        <div class="flex justify-between items-center mb-4">
            <div>
                <p class="text-xs text-slate-400">Aapka Net Balance</p>
                <h1 id="netBalance" class="text-3xl font-bold tracking-tight">₹0</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddModal()" class="bg-accentBlue hover:bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-blue-500/20 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Entry
                </button>
            </div>
        </div>

        <!-- Top Gradient Summary Card -->
        <div class="bg-gradient-to-br from-emerald-950/60 via-slate-900 to-slate-900 border border-emerald-900/40 rounded-2xl p-4 shadow-xl">
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="border-r border-slate-800 pr-2">
                    <p class="text-[11px] text-slate-400">Aamdani</p>
                    <p id="totalAamdani" class="text-sm sm:text-base font-semibold text-emerald-400">₹0</p>
                </div>
                <div class="border-r border-slate-800 pr-2">
                    <p class="text-[11px] text-slate-400">Kharcha</p>
                    <p id="totalKharcha" class="text-sm sm:text-base font-semibold text-rose-400">₹0</p>
                </div>
                <div>
                    <p class="text-[11px] text-slate-400">Pending Udhaar</p>
                    <p id="totalPending" class="text-sm sm:text-base font-semibold text-amber-400">₹0</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="px-4 space-y-4">

        <!-- 2x3 Status Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5">
                <p class="text-xs text-slate-400">Aaj ki income</p>
                <p id="todayIncome" class="text-lg font-bold text-emerald-400 mt-1">₹0</p>
            </div>
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5">
                <p class="text-xs text-slate-400">Aaj ka kharcha</p>
                <p id="todayExpense" class="text-lg font-bold text-rose-400 mt-1">₹0</p>
            </div>
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5">
                <p class="text-xs text-slate-400">Mujhe lene hain</p>
                <p id="mujheLeneHain" class="text-lg font-bold text-amber-400 mt-1">₹0</p>
            </div>
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5">
                <p class="text-xs text-slate-400">Mujhe dene hain</p>
                <p id="mujheDeneHain" class="text-lg font-bold text-amber-400 mt-1">₹0</p>
            </div>
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5">
                <p class="text-xs text-slate-400">🎮 Game P/L</p>
                <p id="gameProfitLoss" class="text-lg font-bold text-purple-400 mt-1">₹0</p>
            </div>
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5">
                <p class="text-xs text-slate-400">📈 Total Invested</p>
                <p id="totalInvestment" class="text-lg font-bold text-blue-400 mt-1">₹0</p>
            </div>
        </div>

        <!-- Quick Add Section -->
        <div>
            <div class="flex justify-between items-center mb-2.5">
                <h2 class="text-sm font-semibold text-slate-300">Quick Add</h2>
                <span class="text-[11px] text-slate-500">Ek tap mein entry</span>
            </div>
            <div class="grid grid-cols-4 gap-2.5">
                <button onclick="openAddModalWithCategory('Income')" class="bg-cardBg hover:bg-slate-800 border border-cardBorder p-3 rounded-2xl flex flex-col items-center gap-1.5 transition">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-sack-dollar"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300">Income</span>
                </button>
                <button onclick="openAddModalWithCategory('Kharcha')" class="bg-cardBg hover:bg-slate-800 border border-cardBorder p-3 rounded-2xl flex flex-col items-center gap-1.5 transition">
                    <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300">Kharcha</span>
                </button>
                <button onclick="openAddModalWithCategory('Udhaar Lena')" class="bg-cardBg hover:bg-slate-800 border border-cardBorder p-3 rounded-2xl flex flex-col items-center gap-1.5 transition">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-handshake-angle"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300">Udhaar Lena</span>
                </button>
                <button onclick="openAddModalWithCategory('Udhaar Dena')" class="bg-cardBg hover:bg-slate-800 border border-cardBorder p-3 rounded-2xl flex flex-col items-center gap-1.5 transition">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-box-archive"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300">Udhaar Dena</span>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2.5 mt-2.5">
                <button onclick="openAddModalWithCategory('Game')" class="bg-cardBg hover:bg-slate-800 border border-cardBorder p-3 rounded-2xl flex items-center justify-center gap-2 transition">
                    <div class="w-8 h-8 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-base">
                        <i class="fa-solid fa-gamepad"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300">🎮 Game P/L</span>
                </button>
                <button onclick="openAddModalWithCategory('Investment')" class="bg-cardBg hover:bg-slate-800 border border-cardBorder p-3 rounded-2xl flex items-center justify-center gap-2 transition">
                    <div class="w-8 h-8 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-base">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300">📈 Investment</span>
                </button>
            </div>
        </div>

        <!-- Transactions Section -->
        <div class="pt-2">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-300">Transactions</h2>
                <button onclick="openAddModal()" class="bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Add
                </button>
            </div>

            <!-- Search & Filters -->
            <div class="space-y-2 mb-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" oninput="renderTransactions()" placeholder="Naam, note, UTR ya amount search karo..." class="w-full bg-cardBg border border-cardBorder rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="filterType" onchange="renderTransactions()" class="bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500">
                        <option value="All">Sabhi types</option>
                        <option value="Income">Income</option>
                        <option value="Kharcha">Kharcha</option>
                        <option value="Udhaar Lena">Udhaar Lena</option>
                        <option value="Udhaar Dena">Udhaar Dena</option>
                        <option value="Game">Game P/L</option>
                        <option value="Investment">Investment</option>
                    </select>
                    <select id="filterMode" onchange="renderTransactions()" class="bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500">
                        <option value="All">Sabhi modes</option>
                        <option value="Cash">Cash</option>
                        <option value="Online">Online/UPI</option>
                    </select>
                </div>
            </div>

            <!-- Transaction List Container -->
            <div id="transactionList" class="space-y-2.5">
                <!-- Dynamic Items -->
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-cardBg border-t border-cardBorder py-2 px-6 flex justify-around items-center z-40">
        <button onclick="switchTab('home')" id="navHome" class="flex flex-col items-center gap-1 text-blue-400">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="switchTab('hisab')" id="navHisab" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] font-medium">Hisab</span>
        </button>
        <button onclick="switchTab('report')" id="navReport" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-chart-pie text-base"></i>
            <span class="text-[10px] font-medium">Report</span>
        </button>
        <button onclick="switchTab('backup')" id="navBackup" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-floppy-disk text-base"></i>
            <span class="text-[10px] font-medium">Backup</span>
        </button>
    </nav>

    <!-- Add/Edit Transaction Modal -->
    <div id="transactionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
        <div class="bg-cardBg border border-cardBorder w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-base font-semibold text-slate-200">Nayi Entry Karein</h3>
                <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="transactionForm" onsubmit="saveTransaction(event)" class="space-y-4">
                <!-- Type Selection -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">Entry Type</label>
                    <select id="entryType" onchange="onEntryTypeChange()" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="Income">Aamdani (Income)</option>
                        <option value="Kharcha">Kharcha (Expense)</option>
                        <option value="Udhaar Lena">Udhaar Lena (Borrowed)</option>
                        <option value="Udhaar Dena">Udhaar Dena (Lent)</option>
                        <option value="Game">🎮 Game Profit / Loss</option>
                        <option value="Investment">📈 Investment</option>
                    </select>
                </div>

                <!-- Sub-type for Game / Investment -->
                <div id="gameInvestmentSubtypeContainer" class="hidden">
                    <label class="block text-xs text-slate-400 mb-1.5">Game / Investment Status</label>
                    <select id="subCategoryStatus" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="Profit">Profit / Winning (+)</option>
                        <option value="Loss">Loss / Entry Fee (-)</option>
                    </select>
                </div>

                <!-- Amount -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">Amount (₹)</label>
                    <input type="number" id="entryAmount" required placeholder="0" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3.5 py-2.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 font-bold">
                </div>

                <!-- Name / Title -->
                <div>
                    <label id="nameLabel" class="block text-xs text-slate-400 mb-1.5">Naam / Party Name</label>
                    <input type="text" id="entryName" placeholder="Jaise: Dosto se, Free Fire tournament, ya dukaan" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3.5 py-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Payment Mode: Cash vs Online -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">Payment Mode</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="modeCashBtn" onclick="setPaymentMode('Cash')" class="py-2.5 px-4 rounded-xl text-xs font-medium border border-cardBorder bg-darkBg text-slate-300 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-money-bill-wave text-emerald-400"></i> Cash
                        </button>
                        <button type="button" id="modeOnlineBtn" onclick="setPaymentMode('Online')" class="py-2.5 px-4 rounded-xl text-xs font-medium border border-cardBorder bg-darkBg text-slate-300 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-mobile-screen-button text-blue-400"></i> Online / UPI
                        </button>
                    </div>
                </div>

                <!-- Online Apps & UTR Section (Hidden if Cash) -->
                <div id="onlineDetailsContainer" class="space-y-3 hidden bg-darkBg/50 p-3.5 rounded-xl border border-cardBorder">
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-xs text-slate-400">UPI App Chunein</label>
                            <button type="button" onclick="promptAddCustomApp()" class="text-[11px] text-blue-400 hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-plus"></i> Add New App
                            </button>
                        </div>
                        <div id="upiAppsGrid" class="grid grid-cols-3 gap-2">
                            <!-- Dynamically rendered UPI buttons -->
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1.5">UTR / Reference Number (Optional)</label>
                        <input type="text" id="entryUtr" placeholder="Jaise: 423156789012" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- Note / Description -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">Note (Optional)</label>
                    <input type="text" id="entryNote" placeholder="Koi extra detail..." class="w-full bg-darkBg border border-cardBorder rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl text-xs transition shadow-lg shadow-blue-500/20">
                    Save Entry
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('mera_hisab_transactions')) || [];
        let upiAppsList = JSON.parse(localStorage.getItem('mera_hisab_apps')) || ['Google Pay', 'PhonePe', 'Paytm', 'BHIM UPI', 'Amazon Pay', 'CRED'];
        
        let currentPaymentMode = 'Cash'; // Default Cash
        let selectedUpiApp = 'Google Pay';

        // Initialize App on Load
        window.onload = function() {
            renderUpiApps();
            renderTransactions();
            updateDashboard();
        }

        function setPaymentMode(mode) {
            currentPaymentMode = mode;
            const cashBtn = document.getElementById('modeCashBtn');
            const onlineBtn = document.getElementById('modeOnlineBtn');
            const onlineContainer = document.getElementById('onlineDetailsContainer');

            if (mode === 'Cash') {
                cashBtn.className = 'py-2.5 px-4 rounded-xl text-xs font-medium border border-emerald-500 bg-emerald-500/10 text-emerald-400 flex items-center justify-center gap-2';
                onlineBtn.className = 'py-2.5 px-4 rounded-xl text-xs font-medium border border-cardBorder bg-darkBg text-slate-300 flex items-center justify-center gap-2';
                onlineContainer.classList.add('hidden');
            } else {
                onlineBtn.className = 'py-2.5 px-4 rounded-xl text-xs font-medium border border-blue-500 bg-blue-500/10 text-blue-400 flex items-center justify-center gap-2';
                cashBtn.className = 'py-2.5 px-4 rounded-xl text-xs font-medium border border-cardBorder bg-darkBg text-slate-300 flex items-center justify-center gap-2';
                onlineContainer.classList.remove('hid
